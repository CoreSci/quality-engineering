# UI tests for the reading-list demo page (ui-testing/).
# The job runs inside the official Playwright image, pinned by digest: it brings
# Python 3.12.3 and the browser builds that Playwright 1.64.1 expects, so nothing is
# downloaded at run time except the pinned Python packages. The page is served by the
# test session on 127.0.0.1; any request to another host fails the test.
# Actions are pinned to full commit SHAs (tag in the comment); the token is read-only;
# no secrets. Traces and screenshots are kept only for failed tests, 7 days.
name: ui-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ui-testing

jobs:
  playwright:
    name: Playwright (Chromium, Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # mcr.microsoft.com/playwright/python:v1.64.1-noble, pinned by digest (recorded 2026-10-30)
      image: mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned test dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt

      - name: Run the UI tests
        run: |
          python -m pytest -q -p no:cacheprovider --junitxml=reports/junit-ui-tests.xml

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-ui-tests
          path: ui-testing/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload traces and screenshots of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-failures
          path: ui-testing/test-results/
          if-no-files-found: ignore
          retention-days: 7
